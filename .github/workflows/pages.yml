name: Publish FallRPG

on:
  push:
    branches: [main]
    paths:
      - 'wizard-combat/**'
      - 'hollow-pixel/**'
      - 'game-picker/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizard-combat
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            wizard-combat/package-lock.json
            hollow-pixel/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Test gameplay
        run: npm test
      - name: Build playable game
        run: npm run build
      - name: Install pixel game dependencies
        run: npm ci
        working-directory: hollow-pixel
      - name: Test pixel gameplay
        run: npm test
        working-directory: hollow-pixel
      - name: Build pixel game
        run: npm run build
        working-directory: hollow-pixel
      - name: Assemble game picker and both games
        run: node scripts/build-site.mjs
        working-directory: .
      - name: Install browser for publishing checks
        run: npx playwright install --with-deps chromium --only-shell
        working-directory: hollow-pixel
      - name: Check picker and game URLs under the Pages subpath
        run: node scripts/check-site.mjs
        working-directory: .
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # New Pages sites can spend more than ten minutes in GitHub's queue.
          timeout: 1800000
